<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Laundry int </title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
  <style>
    .login-container {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    }
    .login-card {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
    }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="login-card">
      <div class="login-header">
        <i class="fas fa-tshirt" style="font-size: 3rem; color: #4361ee;"></i>
        <h1>Laundry int </h1>
        <p style="color: #64748b;">Sistem Manajemen Laundry</p>
      </div>
      
      <form id="loginForm">
        <div class="form-group">
          <label class="form-label">Email</label>
          <input type="email" id="email" class="form-control" placeholder="Email@example.com" required>
        </div>
        <div class="form-group">
          <label class="form-label">Password</label>
          <input type="password" id="password" class="form-control" placeholder="Password" required>
        </div>
        <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem;">
          <i class="fas fa-sign-in-alt"></i> Login
        </button>
      </form>
      
      <div style="margin-top: 1.5rem; text-align: center;">
        <p style="font-size: 0.875rem; color: #64748b;">
          Demo Account:<br>
          Admin: admin@laundry.com / admin123<br>
          Pelanggan: pelanggan@example.com / user123
        </p>
        <a href="register.html" style="color: #4361ee; text-decoration: none;">Belum punya akun? Daftar</a>
      </div>
    </div>
  </div>
    <script src="js/auth.js"></script>
  <script src="js/api.js"></script>
  <script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      
      try {
        const result = await auth.login(email, password);
        if (result.success) {
          const user = result.user;
          if (user.role === 'admin') {
            window.location.href = 'pages/admin.html';
          } else if (user.role === 'operator') {
            window.location.href = 'pages/operator.html';
          } else {
            window.location.href = 'pages/user.html';
          }
        } else {
          alert('Login gagal: ' + result.message);
        }
      } catch (error) {
        alert('Error: ' + error.message);
      }
    });
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Laundry int</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: #0F172A;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow-x: hidden;
        }
        .bg-gradient {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -2;
            background: radial-gradient(circle at 20% 30%, #0F172A, #020617, #000000);
        }
        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            overflow: hidden;
        }
        .particle {
            position: absolute;
            width: 2px;
            height: 2px;
            background: #3B82F6;
            border-radius: 50%;
            opacity: 0.4;
            animation: floatParticle 15s infinite linear;
        }
        @keyframes floatParticle {
            0% { transform: translateY(100vh) scale(0); opacity: 0; }
            10% { opacity: 0.6; }
            90% { opacity: 0.3; }
            100% { transform: translateY(-100vh) scale(1); opacity: 0; }
        }
        .login-container { width: 100%; max-width: 450px; padding: 20px; }
        .login-card {
            background: rgba(30, 41, 59, 0.9);
            backdrop-filter: blur(20px);
            border-radius: 32px;
            padding: 40px;
            border: 1px solid rgba(59, 130, 246, 0.3);
            box-shadow: 0 25px 50px rgba(0,0,0,0.3);
        }
        .logo-icon {
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, #3B82F6, #06B6D4);
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            font-size: 28px;
            box-shadow: 0 0 25px rgba(59,130,246,0.5);
        }
        .login-card h1 {
            text-align: center;
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 8px;
            background: linear-gradient(135deg, #fff, #60A5FA);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        .login-card p { text-align: center; color: #94A3B8; font-size: 14px; margin-bottom: 30px; }
        .form-group { margin-bottom: 20px; }
        .form-label { display: block; margin-bottom: 8px; color: #60A5FA; font-size: 13px; font-weight: 500; }
        .form-control {
            width: 100%;
            padding: 14px 16px;
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(59,130,246,0.3);
            border-radius: 16px;
            color: white;
            font-size: 14px;
        }
        .form-control:focus { outline: none; border-color: #3B82F6; box-shadow: 0 0 0 3px rgba(59,130,246,0.2); }
        .btn-login {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #3B82F6, #06B6D4);
            border: none;
            border-radius: 16px;
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 0 20px rgba(59,130,246,0.3);
        }
        .btn-login:hover { transform: translateY(-2px); box-shadow: 0 10px 30px rgba(59,130,246,0.5); }
        .register-link { text-align: center; margin-top: 25px; color: #94A3B8; font-size: 14px; }
        .register-link a { color: #60A5FA; text-decoration: none; }
        .error-msg {
            background: rgba(239,68,68,0.2);
            border: 1px solid #EF4444;
            border-radius: 12px;
            padding: 12px;
            margin-bottom: 20px;
            color: #FECACA;
            font-size: 13px;
            text-align: center;
            display: none;
        }
        .demo-accounts {
            margin-top: 25px;
            padding-top: 20px;
            border-top: 1px solid rgba(59,130,246,0.2);
            font-size: 12px;
            color: #64748B;
            text-align: center;
        }
        .demo-accounts p { margin: 5px 0; }
        .demo-accounts strong { color: #60A5FA; }
    </style>
</head>
<body>
    <div class="bg-gradient"></div>
    <div class="particles" id="particles"></div>

    <div class="login-container">
        <div class="login-card">
            <div class="logo-icon"><i class="fas fa-tshirt"></i></div>
            <h1>Laundry int</h1>
            <p>Login ke akun Anda</p>
            <div id="errorMsg" class="error-msg"></div>
            <form id="loginForm">
                <div class="form-group">
                    <label class="form-label">Email</label>
                    <input type="email" id="email" class="form-control" placeholder="admin@laundry.com" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Password</label>
                    <input type="password" id="password" class="form-control" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn-login"><i class="fas fa-sign-in-alt"></i> Login</button>
            </form>
            <div class="demo-accounts">
                <strong>Demo Account:</strong>
                <p>👑 Admin: admin@laundry.com / admin123</p>
                <p>🔧 Karyawan: karyawan@laundry.com / karyawan123</p>
                <p>👤 Pelanggan: pelanggan@example.com / user123</p>
            </div>
            <div class="register-link">
                Belum punya akun? <a href="register.html">Daftar Sekarang</a>
            </div>
        </div>
    </div>

    <script>
        function createParticles() {
            const container = document.getElementById('particles');
            for (let i = 0; i < 80; i++) {
                const p = document.createElement('div');
                p.className = 'particle';
                p.style.left = Math.random() * 100 + '%';
                p.style.animationDelay = Math.random() * 15 + 's';
                p.style.animationDuration = Math.random() * 10 + 10 + 's';
                container.appendChild(p);
            }
        }
        createParticles();

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const errorMsg = document.getElementById('errorMsg');
            errorMsg.style.display = 'none';

            try {
                const response = await fetch('http://localhost:3000/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                const data = await response.json();

                if (data.success) {
                    localStorage.setItem('currentUser', JSON.stringify(data.user));
                    localStorage.setItem('token', data.token);
                    
                    if (data.user.role === 'admin') {
                        window.location.href = 'pages/admin.html';
                    } else if (data.user.role === 'karyawan') {
                        window.location.href = 'pages/karyawan.html';
                    } else {
                        window.location.href = 'pages/pelanggan.html';
                    }
                } else {
                    errorMsg.textContent = data.message || 'Login gagal!';
                    errorMsg.style.display = 'block';
                }
            } catch (error) {
                errorMsg.textContent = 'Error: ' + error.message;
                errorMsg.style.display = 'block';
            }
        });
    </script>
</body>
</html>

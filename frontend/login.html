<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Login - LaundryInt</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/design-system.css">
    <link rel="stylesheet" href="../css/responsive.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: #0F172A;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow-x: hidden;
        }
        .bg-gradient {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -2;
            background: radial-gradient(circle at 20% 30%, #0F172A, #020617, #000000);
        }
        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            overflow: hidden;
        }
        .particle {
            position: absolute;
            width: 2px;
            height: 2px;
            background: #3B82F6;
            border-radius: 50%;
            opacity: 0.4;
            animation: floatParticle 15s infinite linear;
        }
        @keyframes floatParticle {
            0% { transform: translateY(100vh) scale(0); opacity: 0; }
            10% { opacity: 0.6; }
            90% { opacity: 0.3; }
            100% { transform: translateY(-100vh) scale(1); opacity: 0; }
        }
        .login-container { width: 100%; max-width: 450px; padding: 20px; }
        .login-card {
            background: rgba(30, 41, 59, 0.9);
            backdrop-filter: blur(20px);
            border-radius: 32px;
            padding: 40px;
            border: 1px solid rgba(59, 130, 246, 0.3);
            box-shadow: 0 25px 50px rgba(0,0,0,0.3);
        }
        .logo-icon {
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, #3B82F6, #06B6D4);
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            font-size: 28px;
            box-shadow: 0 0 25px rgba(59,130,246,0.5);
        }
        .login-card h1 {
            text-align: center;
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 8px;
            background: linear-gradient(135deg, #fff, #60A5FA);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        .login-card p { text-align: center; color: #94A3B8; font-size: 14px; margin-bottom: 30px; }
        .form-group { margin-bottom: 20px; }
        .form-label { display: block; margin-bottom: 8px; color: #60A5FA; font-size: 13px; font-weight: 500; }
        .form-control {
            width: 100%;
            padding: 14px 16px;
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(59,130,246,0.3);
            border-radius: 16px;
            color: white;
            font-size: 14px;
        }
        .form-control:focus { outline: none; border-color: #3B82F6; box-shadow: 0 0 0 3px rgba(59,130,246,0.2); }
        .btn-login {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #3B82F6, #06B6D4);
            border: none;
            border-radius: 16px;
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 0 20px rgba(59,130,246,0.3);
        }
        .btn-login:hover { transform: translateY(-2px); box-shadow: 0 10px 30px rgba(59,130,246,0.5); }
        .btn-outline {
            background: transparent;
            border: 1px solid rgba(59,130,246,0.5);
            color: #60A5FA;
        }
        .btn-outline:hover {
            background: rgba(59,130,246,0.1);
        }
        .register-link { text-align: center; margin-top: 25px; color: #94A3B8; font-size: 14px; }
        .register-link a { color: #60A5FA; text-decoration: none; }
        .register-link a:hover { text-decoration: underline; }
        .forgot-link { text-align: right; margin-top: 5px; font-size: 12px; }
        .forgot-link a { color: #60A5FA; text-decoration: none; }
        .forgot-link a:hover { text-decoration: underline; }
        .error-msg {
            background: rgba(239,68,68,0.2);
            border: 1px solid #EF4444;
            border-radius: 12px;
            padding: 12px;
            margin-bottom: 20px;
            color: #FECACA;
            font-size: 13px;
            text-align: center;
            display: none;
        }
        .success-msg {
            background: rgba(16,185,129,0.2);
            border: 1px solid #10B981;
            border-radius: 12px;
            padding: 12px;
            margin-bottom: 20px;
            color: #A7F3D0;
            font-size: 13px;
            text-align: center;
            display: none;
        }
        .demo-accounts {
            margin-top: 25px;
            padding-top: 20px;
            border-top: 1px solid rgba(59,130,246,0.2);
            font-size: 12px;
            color: #64748B;
            text-align: center;
        }
        .demo-accounts p { margin: 5px 0; }
        .demo-accounts strong { color: #60A5FA; }
        
        /* Reset Password Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(8px);
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        .modal.active { display: flex; }
        .modal-content {
            background: rgba(30,41,59,0.98);
            border-radius: 24px;
            width: 90%;
            max-width: 400px;
            border: 1px solid rgba(59,130,246,0.3);
        }
        .modal-header {
            padding: 20px;
            border-bottom: 1px solid rgba(59,130,246,0.2);
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: white;
        }
        .modal-body { padding: 20px; }
        .modal-footer {
            padding: 20px;
            border-top: 1px solid rgba(59,130,246,0.2);
            display: flex;
            justify-content: flex-end;
            gap: 12px;
        }
        .modal-close {
            background: none;
            border: none;
            font-size: 24px;
            color: #94A3B8;
            cursor: pointer;
        }
        .password-strength {
            height: 4px;
            margin-top: 8px;
            border-radius: 2px;
            transition: all 0.3s;
        }
        .strength-weak { background: #EF4444; width: 33%; }
        .strength-medium { background: #F59E0B; width: 66%; }
        .strength-strong { background: #10B981; width: 100%; }
        
        @media (max-width: 480px) {
            .login-card { padding: 25px; }
            .login-card h1 { font-size: 24px; }
        }
    </style>
</head>
<body>
    <div class="bg-gradient"></div>
    <div class="particles" id="particles"></div>

    <div class="login-container">
        <div class="login-card">
            <div class="logo-icon"><i class="fas fa-tshirt"></i></div>
            <h1>Laundry int</h1>
            <p>Login ke akun Anda</p>
            
            <div id="errorMsg" class="error-msg"></div>
            <div id="successMsg" class="success-msg"></div>
            
            <form id="loginForm">
                <div class="form-group">
                    <label class="form-label">Email</label>
                    <input type="email" id="email" class="form-control" placeholder="admin@laundry.com" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Password</label>
                    <input type="password" id="password" class="form-control" placeholder="••••••••" required>
                </div>
                <div class="forgot-link">
                    <a href="#" onclick="showForgotPasswordModal(); return false;">Lupa Password?</a>
                </div>
                <button type="submit" class="btn-login"><i class="fas fa-sign-in-alt"></i> Login</button>
            </form>
            
            
            <div class="register-link">
                Belum punya akun? <a href="register.html">Daftar Sekarang</a>
            </div>
        </div>
    </div>

    <!-- Modal Forgot Password -->
    <div id="forgotModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3><i class="fas fa-key"></i> Lupa Password</h3>
                <button class="modal-close" onclick="closeForgotModal()">&times;</button>
            </div>
            <div class="modal-body">
                <div id="forgotErrorMsg" class="error-msg" style="display:none;"></div>
                <div id="forgotSuccessMsg" class="success-msg" style="display:none;"></div>
                
                <form id="forgotForm">
                    <div class="form-group">
                        <label class="form-label">Email Anda</label>
                        <input type="email" id="resetEmail" class="form-control" placeholder="email@example.com" required>
                    </div>
                    <button type="submit" class="btn-login" style="margin-top:10px;"><i class="fas fa-paper-plane"></i> Kirim Kode OTP</button>
                </form>
                
                <div style="text-align: center; margin: 15px 0; color: #64748B;">atau</div>
                
                <form id="resetForm">
                    <div class="form-group">
                        <label class="form-label">Kode OTP</label>
                        <input type="text" id="resetToken" class="form-control" placeholder="Masukkan 6 digit kode OTP" maxlength="6" inputmode="numeric" pattern="[0-9]*" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Password Baru</label>
                        <input type="password" id="newPassword" class="form-control" placeholder="Minimal 6 karakter" required oninput="updateStrength()">
                        <div class="password-strength" id="strengthBar"></div>
                        <small id="strengthText" style="color:#64748B;">Ketik password baru</small>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Konfirmasi Password Baru</label>
                        <input type="password" id="confirmPassword" class="form-control" placeholder="Ulangi password baru" required>
                    </div>
                    <button type="submit" class="btn-login" style="margin-top:10px;"><i class="fas fa-sync-alt"></i> Reset Password</button>
                </form>
            </div>
        </div>
    </div>

    <script src="./js/api.js"></script>
    <script>
        function createParticles() {
            const container = document.getElementById('particles');
            for (let i = 0; i < 80; i++) {
                const p = document.createElement('div');
                p.className = 'particle';
                p.style.left = Math.random() * 100 + '%';
                p.style.animationDelay = Math.random() * 15 + 's';
                p.style.animationDuration = Math.random() * 10 + 10 + 's';
                container.appendChild(p);
            }
        }
        createParticles();

        // ============ LOGIN ============
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const errorMsg = document.getElementById('errorMsg');
            const successMsg = document.getElementById('successMsg');
            
            errorMsg.style.display = 'none';
            successMsg.style.display = 'none';

            if (!email || !password) {
                errorMsg.textContent = 'Email dan password wajib diisi!';
                errorMsg.style.display = 'block';
                return;
            }

            try {
                // ✅ PAKAI LaundryAPI dari api.js
                const data = await LaundryAPI.login(email, password);

                if (data.success) {
                    // Simpan data user dan token
                    localStorage.setItem('currentUser', JSON.stringify(data.user));
                    localStorage.setItem('token', data.token);
                    
                    successMsg.textContent = 'Login berhasil! Mengarahkan...';
                    successMsg.style.display = 'block';

                    // Redirect berdasarkan role
                    setTimeout(() => {
                        if (data.user.role === 'admin') {
                            window.location.href = '/pages/admin.html';
                        } else if (data.user.role === 'karyawan') {
                            window.location.href = '/pages/karyawan.html';
                        } else {
                            window.location.href = '/pages/pelanggan.html';
                        }
                    }, 1000);
                } else {
                    errorMsg.textContent = data.message || 'Login gagal! Periksa email dan password Anda.';
                    errorMsg.style.display = 'block';
                }
            } catch (error) {
                console.error('Login error:', error);
                errorMsg.textContent = error.message || 'Terjadi kesalahan saat login.';
                errorMsg.style.display = 'block';
            }
        });

        // ============ FORGOT PASSWORD ============
        function showForgotPasswordModal() {
            document.getElementById('forgotModal').classList.add('active');
            document.getElementById('forgotErrorMsg').style.display = 'none';
            document.getElementById('forgotSuccessMsg').style.display = 'none';
            document.getElementById('resetEmail').value = '';
            document.getElementById('resetToken').value = '';
            document.getElementById('newPassword').value = '';
            document.getElementById('confirmPassword').value = '';
            document.getElementById('strengthBar').className = 'password-strength';
            document.getElementById('strengthText').innerHTML = 'Ketik password baru';
            document.getElementById('strengthText').style.color = '#64748B';
        }

        function closeForgotModal() {
            document.getElementById('forgotModal').classList.remove('active');
        }

        function updateStrength() {
            const password = document.getElementById('newPassword').value;
            let strength = 0;
            if (password.length >= 6) strength++;
            if (password.length >= 10) strength++;
            if (/[A-Z]/.test(password)) strength++;
            if (/[0-9]/.test(password)) strength++;
            if (/[^A-Za-z0-9]/.test(password)) strength++;
            
            const bar = document.getElementById('strengthBar');
            const text = document.getElementById('strengthText');
            
            if (strength <= 2) {
                bar.className = 'password-strength strength-weak';
                text.innerHTML = '🔴 Password lemah';
                text.style.color = '#EF4444';
            } else if (strength <= 4) {
                bar.className = 'password-strength strength-medium';
                text.innerHTML = '🟡 Password sedang';
                text.style.color = '#F59E0B';
            } else {
                bar.className = 'password-strength strength-strong';
                text.innerHTML = '🟢 Password kuat';
                text.style.color = '#10B981';
            }
        }

        // Request reset token
        document.getElementById('forgotForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const email = document.getElementById('resetEmail').value.trim();
            const errorMsg = document.getElementById('forgotErrorMsg');
            const successMsg = document.getElementById('forgotSuccessMsg');
            
            errorMsg.style.display = 'none';
            successMsg.style.display = 'none';
            
            if (!email) {
                errorMsg.textContent = 'Email wajib diisi!';
                errorMsg.style.display = 'block';
                return;
            }

            try {
                // ✅ PAKAI LaundryAPI dari api.js
                const data = await LaundryAPI.request('/forgot-password', {
                    method: 'POST',
                    body: JSON.stringify({ email })
                });
                
                if (data.success) {
                    successMsg.textContent = data.message || 'Token reset telah dikirim ke email Anda.';
                    successMsg.style.display = 'block';
                    
                    // Untuk development: tampilkan token di alert
                    if (data.token) {
                        setTimeout(() => {
                            alert(`🔐 Kode OTP Anda: ${data.token}\n\nMasukkan kode ini di form reset password.\n\n(Kode ini hanya untuk demo, di production akan dikirim via email)`);
                        }, 500);
                    }
                } else {
                    errorMsg.textContent = data.message || 'Gagal mengirim token reset.';
                    errorMsg.style.display = 'block';
                }
            } catch (error) {
                console.error('Forgot password error:', error);
                errorMsg.textContent = error.message || 'Terjadi kesalahan.';
                errorMsg.style.display = 'block';
            }
        });

        // Reset password with token
        document.getElementById('resetForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const token = document.getElementById('resetToken').value.trim();
            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const errorMsg = document.getElementById('forgotErrorMsg');
            const successMsg = document.getElementById('forgotSuccessMsg');
            
            errorMsg.style.display = 'none';
            successMsg.style.display = 'none';
            
            if (!token || !newPassword || !confirmPassword) {
                errorMsg.textContent = 'Semua field wajib diisi!';
                errorMsg.style.display = 'block';
                return;
            }
            
            if (newPassword !== confirmPassword) {
                errorMsg.textContent = 'Konfirmasi password tidak cocok!';
                errorMsg.style.display = 'block';
                return;
            }
            
            if (newPassword.length < 6) {
                errorMsg.textContent = 'Password minimal 6 karakter!';
                errorMsg.style.display = 'block';
                return;
            }
            
            try {
                // ✅ PAKAI LaundryAPI dari api.js
                const data = await LaundryAPI.request('/reset-password', {
                    method: 'POST',
                    body: JSON.stringify({ token, newPassword })
                });
                
                if (data.success) {
                    successMsg.textContent = data.message || 'Password berhasil direset!';
                    successMsg.style.display = 'block';
                    
                    setTimeout(() => {
                        closeForgotModal();
                        document.getElementById('email').value = '';
                        document.getElementById('password').value = '';
                        alert('✅ Password berhasil direset! Silakan login dengan password baru Anda.');
                    }, 1500);
                } else {
                    errorMsg.textContent = data.message || 'Gagal reset password.';
                    errorMsg.style.display = 'block';
                }
            } catch (error) {
                console.error('Reset password error:', error);
                errorMsg.textContent = error.message || 'Terjadi kesalahan.';
                errorMsg.style.display = 'block';
            }
        });

        // Close modal when clicking outside
        window.onclick = function(event) {
            const modal = document.getElementById('forgotModal');
            if (event.target === modal) {
                closeForgotModal();
            }
        }

        // Auto-fill demo (klik tombol demo untuk isi otomatis)
        document.querySelectorAll('.demo-accounts p[data-email]').forEach(function(el) {
            el.style.cursor = 'pointer';
            el.title = 'Klik untuk isi otomatis';
            el.addEventListener('click', function() {
                document.getElementById('email').value = el.dataset.email;
                document.getElementById('password').value = el.dataset.pass;
            });
        });
    </script>
    <script src="./js/ui-improvements.js"></script>
</body>
</html>

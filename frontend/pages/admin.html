<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - LaundryPro</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', sans-serif;
            background: #0a0e1a;
            color: white;
            overflow-x: hidden;
        }

        /* Animated Gradient Background */
        .bg-gradient {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -2;
            background: radial-gradient(circle at 20% 30%, #0f172a, #020617, #000000);
        }
        .bg-gradient::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: repeating-linear-gradient(45deg, rgba(59,130,246,0.03) 0px, rgba(59,130,246,0.03) 2px, transparent 2px, transparent 8px);
            pointer-events: none;
        }

        /* Floating Particles */
        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            overflow: hidden;
        }
        .particle {
            position: absolute;
            width: 2px;
            height: 2px;
            background: #3b82f6;
            border-radius: 50%;
            opacity: 0.5;
            animation: floatParticle 15s infinite linear;
        }
        @keyframes floatParticle {
            0% { transform: translateY(100vh) scale(0); opacity: 0; }
            10% { opacity: 0.8; }
            90% { opacity: 0.5; }
            100% { transform: translateY(-100vh) scale(1); opacity: 0; }
        }

        /* Sidebar Glass */
        .sidebar {
            position: fixed;
            left: 0;
            top: 0;
            width: 280px;
            height: 100vh;
            background: rgba(10, 14, 26, 0.95);
            backdrop-filter: blur(20px);
            border-right: 1px solid rgba(59, 130, 246, 0.3);
            z-index: 100;
            transition: all 0.4s;
            overflow-y: auto;
        }
        .logo {
            padding: 25px 20px;
            border-bottom: 1px solid rgba(59, 130, 246, 0.2);
            text-align: center;
        }
        .logo-icon {
            width: 55px;
            height: 55px;
            background: linear-gradient(135deg, #3b82f6, #06b6d4);
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 10px;
            font-size: 24px;
            box-shadow: 0 0 20px rgba(59,130,246,0.5);
        }
        .logo h2 { font-size: 1.3rem; font-weight: 700; color: white; }
        .logo p { font-size: 0.7rem; color: #94a3b8; letter-spacing: 1px; }

        .menu-item {
            padding: 14px 24px;
            display: flex;
            align-items: center;
            gap: 14px;
            cursor: pointer;
            transition: all 0.3s;
            color: #cbd5e1;
            margin: 5px 12px;
            border-radius: 12px;
        }
        .menu-item:hover { background: rgba(59, 130, 246, 0.2); color: white; transform: translateX(5px); }
        .menu-item.active {
            background: linear-gradient(135deg, rgba(59,130,246,0.2), rgba(6,182,212,0.2));
            color: white;
            border-left: 3px solid #3b82f6;
        }
        .menu-item i { width: 24px; font-size: 18px; }
        .logout-btn { margin-top: 40px; color: #f43f5e; }
        .logout-btn:hover { background: rgba(244,63,94,0.2); color: #f43f5e; }

        /* Main Content */
        .main-content { margin-left: 280px; padding: 25px 35px; min-height: 100vh; }

        /* Top Bar */
        .top-bar {
            background: rgba(10, 14, 26, 0.9);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            padding: 18px 28px;
            margin-bottom: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid rgba(59, 130, 246, 0.3);
        }
        /* JAM BESAR */
        .datetime {
            background: rgba(59, 130, 246, 0.15);
            padding: 8px 20px;
            border-radius: 40px;
            border: 1px solid rgba(59, 130, 246, 0.4);
            text-align: center;
        }
        .time {
            font-size: 1.6rem;
            font-weight: 700;
            color: #60a5fa;
            font-family: monospace;
            letter-spacing: 3px;
            text-shadow: 0 0 10px rgba(59,130,246,0.8);
        }
        .date { font-size: 0.7rem; color: #94a3b8; margin-top: 2px; }

        .page-title { font-size: 1.3rem; font-weight: 600; color: white; display: flex; align-items: center; gap: 10px; }
        .user-info { display: flex; align-items: center; gap: 15px; background: rgba(59,130,246,0.1); padding: 8px 20px; border-radius: 50px; }
        .user-name { color: white; font-weight: 500; }
        .user-avatar { width: 42px; height: 42px; background: linear-gradient(135deg, #3b82f6, #06b6d4); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; box-shadow: 0 0 15px rgba(59,130,246,0.4); }

        /* Stats Cards */
        .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 25px; margin-bottom: 30px; }
        .stat-card {
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(12px);
            border-radius: 20px;
            padding: 22px;
            border: 1px solid rgba(59, 130, 246, 0.2);
            transition: all 0.4s;
        }
        .stat-card:hover { transform: translateY(-8px); border-color: rgba(59,130,246,0.5); box-shadow: 0 20px 40px rgba(0,0,0,0.3); }
        .stat-icon { width: 50px; height: 50px; background: rgba(59,130,246,0.2); border-radius: 15px; display: flex; align-items: center; justify-content: center; margin-bottom: 15px; }
        .stat-icon i { font-size: 24px; color: #60a5fa; }
        .stat-value { font-size: 32px; font-weight: 800; color: white; }
        .stat-label { color: #94a3b8; font-size: 13px; margin-top: 8px; }

        /* Glass Card */
        .glass-card {
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(12px);
            border-radius: 20px;
            border: 1px solid rgba(59, 130, 246, 0.2);
            overflow: hidden;
            margin-bottom: 25px;
        }
        .card-header { padding: 20px 25px; border-bottom: 1px solid rgba(59,130,246,0.2); display: flex; justify-content: space-between; align-items: center; font-weight: 600; color: white; }
        .card-body { padding: 20px 25px; }

        /* Table */
        table { width: 100%; border-collapse: collapse; }
        th { text-align: left; padding: 15px 12px; color: #60a5fa; font-weight: 500; font-size: 13px; text-transform: uppercase; letter-spacing: 1px; border-bottom: 1px solid rgba(59,130,246,0.2); }
        td { padding: 15px 12px; color: #cbd5e1; border-bottom: 1px solid rgba(59,130,246,0.1); }
        tr:hover td { background: rgba(59,130,246,0.05); }

        /* Badge */
        .badge { padding: 5px 12px; border-radius: 50px; font-size: 11px; font-weight: 600; display: inline-block; }
        .badge-warning { background: linear-gradient(135deg, #f59e0b, #d97706); color: white; }
        .badge-info { background: linear-gradient(135deg, #3b82f6, #2563eb); color: white; }
        .badge-success { background: linear-gradient(135deg, #10b981, #059669); color: white; }

        /* Buttons */
        .btn { padding: 10px 22px; border-radius: 12px; border: none; cursor: pointer; font-size: 13px; font-weight: 600; transition: all 0.3s; }
        .btn-primary { background: linear-gradient(135deg, #3b82f6, #06b6d4); color: white; box-shadow: 0 0 15px rgba(59,130,246,0.3); }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(59,130,246,0.5); }
        .btn-danger { background: linear-gradient(135deg, #ef4444, #dc2626); color: white; }
        .btn-outline { background: rgba(255,255,255,0.1); color: white; border: 1px solid rgba(255,255,255,0.2); }
        .btn-sm { padding: 5px 12px; font-size: 11px; }

        /* Modal */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); backdrop-filter: blur(8px); align-items: center; justify-content: center; z-index: 1000; }
        .modal.active { display: flex; animation: fadeIn 0.3s ease; }
        .modal-content { background: rgba(15, 23, 42, 0.98); backdrop-filter: blur(20px); border-radius: 24px; width: 90%; max-width: 500px; border: 1px solid rgba(59,130,246,0.3); }
        .modal-header { padding: 20px 25px; border-bottom: 1px solid rgba(59,130,246,0.2); display: flex; justify-content: space-between; align-items: center; color: white; }
        .modal-body { padding: 25px; }
        .modal-footer { padding: 20px 25px; border-top: 1px solid rgba(59,130,246,0.2); display: flex; justify-content: flex-end; gap: 12px; }
        .form-control { width: 100%; padding: 12px 16px; background: rgba(255,255,255,0.1); border: 1px solid rgba(59,130,246,0.3); border-radius: 12px; color: white; font-size: 14px; }
        .form-control:focus { outline: none; border-color: #3b82f6; box-shadow: 0 0 0 3px rgba(59,130,246,0.3); }
        .form-label { display: block; margin-bottom: 8px; color: #60a5fa; font-size: 13px; font-weight: 500; }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @media (max-width: 1024px) { .stats-grid { grid-template-columns: repeat(2, 1fr); } }
        @media (max-width: 768px) { .sidebar { transform: translateX(-100%); } .main-content { margin-left: 0; } .stats-grid { grid-template-columns: 1fr; } .time { font-size: 1rem; } }
    </style>
</head>
<body>
    <div class="bg-gradient"></div>
    <div class="particles" id="particles"></div>

    <div class="sidebar">
        <div class="logo"><div class="logo-icon"><i class="fas fa-crown"></i></div><h2>LaundryPro</h2><p>Admin Panel • Premium</p></div>
        <div class="menu-item active" data-page="dashboard"><i class="fas fa-home"></i> Dashboard</div>
        <div class="menu-item" data-page="pesanan"><i class="fas fa-receipt"></i> Pesanan</div>
        <div class="menu-item" data-page="pelanggan"><i class="fas fa-users"></i> Pelanggan</div>
        <div class="menu-item" data-page="layanan"><i class="fas fa-tags"></i> Layanan</div>
        <div class="menu-item" data-page="laporan"><i class="fas fa-chart-pie"></i> Laporan</div>
        <div class="menu-item logout-btn" id="logoutBtn"><i class="fas fa-sign-out-alt"></i> Logout</div>
    </div>

    <div class="main-content">
        <div class="top-bar">
            <div class="datetime"><div class="time" id="currentTime">--:--:--</div><div class="date" id="currentDate">--, -- -- ----</div></div>
            <div class="page-title"><i class="fas fa-chart-line"></i> <span id="pageTitle">Dashboard</span></div>
            <div class="user-info"><span class="user-name" id="userName">Admin</span><div class="user-avatar" id="userAvatar">A</div></div>
        </div>
        <div id="pageContent"><div style="text-align:center; padding:50px; color:#94a3b8;">Loading...</div></div>
    </div>

    <script src="../js/auth.js"></script>
    <script src="../js/api.js"></script>
    <script>
        let currentUser = null;

        function updateDateTime() {
            const now = new Date();
            document.getElementById('currentTime').innerText = now.toLocaleTimeString('id-ID', { hour12: false });
            document.getElementById('currentDate').innerText = now.toLocaleDateString('id-ID', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
        }
        setInterval(updateDateTime, 1000);
        updateDateTime();

        function createParticles() {
            const container = document.getElementById('particles');
            for (let i = 0; i < 120; i++) {
                const p = document.createElement('div');
                p.className = 'particle';
                p.style.left = Math.random() * 100 + '%';
                p.style.animationDelay = Math.random() * 15 + 's';
                p.style.animationDuration = Math.random() * 10 + 10 + 's';
                container.appendChild(p);
            }
        }
        createParticles();

        document.addEventListener('DOMContentLoaded', async () => {
            currentUser = auth.getCurrentUser();
            if (!currentUser || currentUser.role !== 'admin') { window.location.href = '/login.html'; return; }
            document.getElementById('userName').innerText = currentUser.nama;
            document.getElementById('userAvatar').innerText = currentUser.nama.charAt(0).toUpperCase();
            await loadDashboard();
            document.querySelectorAll('.menu-item[data-page]').forEach(item => {
                item.addEventListener('click', () => loadPage(item.getAttribute('data-page')));
            });
            document.getElementById('logoutBtn').addEventListener('click', () => auth.logout());
        });

        async function loadPage(page) {
            document.querySelectorAll('.menu-item').forEach(item => item.classList.remove('active'));
            document.querySelector(`[data-page="${page}"]`).classList.add('active');
            const titles = { dashboard: 'Dashboard', pesanan: 'Manajemen Pesanan', pelanggan: 'Data Pelanggan', layanan: 'Kelola Layanan', laporan: 'Laporan & Statistik' };
            document.getElementById('pageTitle').innerHTML = `<i class="fas ${page === 'dashboard' ? 'fa-chart-line' : page === 'pesanan' ? 'fa-receipt' : page === 'pelanggan' ? 'fa-users' : page === 'layanan' ? 'fa-tags' : 'fa-chart-pie'}"></i> ${titles[page]}`;
            if (page === 'dashboard') await loadDashboard();
            else if (page === 'pesanan') await loadPesanan();
            else if (page === 'pelanggan') await loadPelanggan();
            else if (page === 'layanan') await loadLayanan();
            else if (page === 'laporan') await loadLaporan();
        }

        async function loadDashboard() {
            try {
                const stats = await LaundryAPI.getStatistik();
                const aktivitas = await LaundryAPI.getAktivitas();
                const html = `<div class="stats-grid">
                    <div class="stat-card"><div class="stat-icon"><i class="fas fa-receipt"></i></div><div class="stat-value">${stats.totalPesanan || 0}</div><div class="stat-label">Total Pesanan</div></div>
                    <div class="stat-card"><div class="stat-icon"><i class="fas fa-money-bill-wave"></i></div><div class="stat-value">Rp ${(stats.totalPendapatan || 0).toLocaleString()}</div><div class="stat-label">Total Pendapatan</div></div>
                    <div class="stat-card"><div class="stat-icon"><i class="fas fa-spinner"></i></div><div class="stat-value">${stats.pesananProses || 0}</div><div class="stat-label">Dalam Proses</div></div>
                    <div class="stat-card"><div class="stat-icon"><i class="fas fa-users"></i></div><div class="stat-value">${stats.totalPelanggan || 0}</div><div class="stat-label">Total Pelanggan</div></div>
                </div>
                <div class="glass-card"><div class="card-header"><span><i class="fas fa-history"></i> Aktivitas Terkini</span></div><div class="card-body">${aktivitas.map(a => `<p style="margin-bottom:12px; color:#cbd5e1;">📌 ${a.deskripsi} <span style="color:#64748b; font-size:11px;">- ${new Date(a.createdAt).toLocaleString()}</span></p>`).join('')}${aktivitas.length === 0 ? '<p style="color:#64748b;">Belum ada aktivitas</p>' : ''}</div></div>`;
                document.getElementById('pageContent').innerHTML = html;
            } catch(e) { document.getElementById('pageContent').innerHTML = `<div style="color:red;">Error: ${e.message}</div>`; }
        }

        async function loadPesanan() {
            try {
                const pesanan = await LaundryAPI.getPesanan();
                const pelanggan = await LaundryAPI.getPelanggan();
                const layanan = await LaundryAPI.getLayanan();
                const html = `<button class="btn btn-primary" onclick="alert('Fitur tambah pesanan sedang dalam pengembangan')" style="margin-bottom:20px;"><i class="fas fa-plus"></i> Tambah Pesanan</button>
                <div class="glass-card"><div class="card-header"><span><i class="fas fa-receipt"></i> Daftar Pesanan</span></div><div class="card-body" style="padding:0;"><table class="table"><thead><tr><th>Kode</th><th>Pelanggan</th><th>Layanan</th><th>Berat</th><th>Total</th><th>Status</th><th>Aksi</th></tr></thead><tbody>
                ${pesanan.map(p => `<tr><td><strong>${p.kode}</strong></td><td>${p.pelangganNama}</td><td>${p.layananNama}</td><td>${p.berat} kg</td><td>Rp ${(p.totalBayar || 0).toLocaleString()}</td><td><span class="badge badge-info">${p.status}</span></td>
                <td><button class="btn btn-sm btn-outline" onclick="alert('Edit pesanan')">Edit</button> <button class="btn btn-sm btn-danger" onclick="alert('Hapus pesanan')">Hapus</button></td></tr>`).join('')}
                ${pesanan.length === 0 ? '<tr><td colspan="7" style="text-align:center;">Belum ada pesanan</td></tr>' : ''}</tbody></table></div></div>`;
                document.getElementById('pageContent').innerHTML = html;
            } catch(e) { document.getElementById('pageContent').innerHTML = `<div style="color:red;">Error: ${e.message}</div>`; }
        }

        async function loadPelanggan() {
            try {
                const pelanggan = await LaundryAPI.getPelanggan();
                const html = `<button class="btn btn-primary" onclick="alert('Fitur tambah pelanggan sedang dalam pengembangan')" style="margin-bottom:20px;"><i class="fas fa-plus"></i> Tambah Pelanggan</button>
                <div class="glass-card"><div class="card-header"><span><i class="fas fa-users"></i> Daftar Pelanggan</span></div><div class="card-body" style="padding:0;"><table class="table"><thead><tr><th>Nama</th><th>Email</th><th>No HP</th><th>Alamat</th><th>Aksi</th></tr></thead><tbody>
                ${pelanggan.map(p => `<tr><td><strong>${p.nama}</strong></td><td>${p.email || '-'}</td><td>${p.no_hp}</td><td>${p.alamat || '-'}</td><td><button class="btn btn-sm btn-danger" onclick="alert('Hapus pelanggan')">Hapus</button></td></tr>`).join('')}
                ${pelanggan.length === 0 ? '<tr><td colspan="5" style="text-align:center;">Belum ada pelanggan</td>' : ''}</tbody></table></div></div>`;
                document.getElementById('pageContent').innerHTML = html;
            } catch(e) { document.getElementById('pageContent').innerHTML = `<div style="color:red;">Error: ${e.message}</div>`; }
        }

        async function loadLayanan() {
            try {
                const layanan = await LaundryAPI.getLayanan();
                const html = `<button class="btn btn-primary" onclick="alert('Fitur tambah layanan sedang dalam pengembangan')" style="margin-bottom:20px;"><i class="fas fa-plus"></i> Tambah Layanan</button>
                <div class="glass-card"><div class="card-header"><span><i class="fas fa-tags"></i> Daftar Layanan</span></div><div class="card-body" style="padding:0;"><table class="table"><thead><tr><th>Nama</th><th>Harga/kg</th><th>Estimasi</th><th>Deskripsi</th><th>Aksi</th></tr></thead><tbody>
                ${layanan.map(l => `<tr><td><strong>${l.nama}</strong></td><td>Rp ${l.harga.toLocaleString()}</td><td>${l.estimasi}</td><td>${l.deskripsi || '-'}</td><td><button class="btn btn-sm btn-danger" onclick="alert('Hapus layanan')">Hapus</button></td></tr>`).join('')}</tbody></td></div></div>`;
                document.getElementById('pageContent').innerHTML = html;
            } catch(e) { document.getElementById('pageContent').innerHTML = `<div style="color:red;">Error: ${e.message}</div>`; }
        }

        async function loadLaporan() {
            try {
                const stats = await LaundryAPI.getStatistik();
                const html = `<div class="stats-grid"><div class="stat-card"><div class="stat-value">${stats.totalPesanan || 0}</div><div class="stat-label">Total Pesanan</div></div>
                <div class="stat-card"><div class="stat-value">Rp ${(stats.totalPendapatan || 0).toLocaleString()}</div><div class="stat-label">Total Pendapatan</div></div>
                <div class="stat-card"><div class="stat-value">${stats.totalPelanggan || 0}</div><div class="stat-label">Pelanggan</div></div>
                <div class="stat-card"><div class="stat-value">${stats.totalLayanan || 0}</div><div class="stat-label">Layanan</div></div></div>
                <div class="glass-card"><div class="card-header"><span><i class="fas fa-chart-line"></i> Grafik Pendapatan</span></div><div class="card-body"><canvas id="revenueChart" style="max-height:300px;"></canvas></div></div>`;
                document.getElementById('pageContent').innerHTML = html;
                const script = document.createElement('script');
                script.src = 'https://cdn.jsdelivr.net/npm/chart.js';
                script.onload = () => new Chart(document.getElementById('revenueChart'), { type: 'line', data: { labels: stats.pendapatanPerHari?.map(d=>d.tanggal) || [], datasets: [{ label: 'Pendapatan', data: stats.pendapatanPerHari?.map(d=>d.total) || [], borderColor: '#3b82f6', tension: 0.4, fill: true, backgroundColor: 'rgba(59,130,246,0.1)' }] } });
                document.body.appendChild(script);
            } catch(e) { document.getElementById('pageContent').innerHTML = `<div style="color:red;">Error: ${e.message}</div>`; }
        }

        window.loadPage = loadPage;
    </script>
</body>
</html>

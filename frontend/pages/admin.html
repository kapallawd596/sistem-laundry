<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Laundry int</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: #0a0e1a;
            color: white;
            overflow-x: hidden;
        }
        .bg-gradient {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -2;
            background: radial-gradient(circle at 20% 30%, #0f172a, #020617, #000000);
        }
        .bg-gradient::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: repeating-linear-gradient(45deg, rgba(59,130,246,0.03) 0px, rgba(59,130,246,0.03) 2px, transparent 2px, transparent 8px);
            pointer-events: none;
        }
        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            overflow: hidden;
        }
        .particle {
            position: absolute;
            width: 2px;
            height: 2px;
            background: #3b82f6;
            border-radius: 50%;
            opacity: 0.5;
            animation: floatParticle 15s infinite linear;
        }
        @keyframes floatParticle {
            0% { transform: translateY(100vh) scale(0); opacity: 0; }
            10% { opacity: 0.8; }
            90% { opacity: 0.5; }
            100% { transform: translateY(-100vh) scale(1); opacity: 0; }
        }
        .sidebar {
            position: fixed;
            left: 0;
            top: 0;
            width: 280px;
            height: 100vh;
            background: rgba(10, 14, 26, 0.95);
            backdrop-filter: blur(20px);
            border-right: 1px solid rgba(59, 130, 246, 0.3);
            z-index: 100;
            transition: all 0.4s;
            overflow-y: auto;
        }
        .logo {
            padding: 25px 20px;
            border-bottom: 1px solid rgba(59, 130, 246, 0.2);
            text-align: center;
        }
        .logo-icon {
            width: 55px;
            height: 55px;
            background: linear-gradient(135deg, #3b82f6, #06b6d4);
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 10px;
            font-size: 24px;
            box-shadow: 0 0 20px rgba(59,130,246,0.5);
        }
        .logo h2 { font-size: 1.3rem; font-weight: 700; color: white; }
        .logo p { font-size: 0.7rem; color: #94a3b8; letter-spacing: 1px; }
        .menu-item {
            padding: 14px 24px;
            display: flex;
            align-items: center;
            gap: 14px;
            cursor: pointer;
            transition: all 0.3s;
            color: #cbd5e1;
            margin: 5px 12px;
            border-radius: 12px;
        }
        .menu-item:hover { background: rgba(59, 130, 246, 0.2); color: white; transform: translateX(5px); }
        .menu-item.active {
            background: linear-gradient(135deg, rgba(59,130,246,0.2), rgba(6,182,212,0.2));
            color: white;
            border-left: 3px solid #3b82f6;
        }
        .menu-item i { width: 24px; font-size: 18px; }
        .logout-btn { margin-top: 40px; color: #f43f5e; }
        .logout-btn:hover { background: rgba(244,63,94,0.2); color: #f43f5e; }
        .main-content { margin-left: 280px; padding: 25px 35px; min-height: 100vh; }
        .top-bar {
            background: rgba(10, 14, 26, 0.9);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            padding: 18px 28px;
            margin-bottom: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid rgba(59, 130, 246, 0.3);
        }
        .datetime {
            background: rgba(59, 130, 246, 0.15);
            padding: 8px 20px;
            border-radius: 40px;
            border: 1px solid rgba(59, 130, 246, 0.4);
            text-align: center;
        }
        .time {
            font-size: 1.6rem;
            font-weight: 700;
            color: #60a5fa;
            font-family: monospace;
            letter-spacing: 3px;
            text-shadow: 0 0 10px rgba(59,130,246,0.8);
        }
        .date { font-size: 0.7rem; color: #94a3b8; margin-top: 2px; }
        .page-title { font-size: 1.3rem; font-weight: 600; color: white; display: flex; align-items: center; gap: 10px; }
        .user-info { display: flex; align-items: center; gap: 15px; background: rgba(59,130,246,0.1); padding: 8px 20px; border-radius: 50px; }
        .user-name { color: white; font-weight: 500; }
        .user-avatar { width: 42px; height: 42px; background: linear-gradient(135deg, #3b82f6, #06b6d4); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; box-shadow: 0 0 15px rgba(59,130,246,0.4); }
        .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 25px; margin-bottom: 30px; }
        .stat-card {
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(12px);
            border-radius: 20px;
            padding: 22px;
            border: 1px solid rgba(59, 130, 246, 0.2);
            transition: all 0.4s;
        }
        .stat-card:hover { transform: translateY(-8px); border-color: rgba(59,130,246,0.5); box-shadow: 0 20px 40px rgba(0,0,0,0.3); }
        .stat-icon { width: 50px; height: 50px; background: rgba(59,130,246,0.2); border-radius: 15px; display: flex; align-items: center; justify-content: center; margin-bottom: 15px; }
        .stat-icon i { font-size: 24px; color: #60a5fa; }
        .stat-value { font-size: 32px; font-weight: 800; color: white; }
        .stat-label { color: #94a3b8; font-size: 13px; margin-top: 8px; }
        .glass-card {
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(12px);
            border-radius: 20px;
            border: 1px solid rgba(59, 130, 246, 0.2);
            overflow: hidden;
            margin-bottom: 25px;
        }
        .card-header { padding: 20px 25px; border-bottom: 1px solid rgba(59,130,246,0.2); display: flex; justify-content: space-between; align-items: center; font-weight: 600; color: white; }
        .card-body { padding: 20px 25px; }
        table { width: 100%; border-collapse: collapse; }
        th { text-align: left; padding: 15px 12px; color: #60a5fa; font-weight: 500; font-size: 13px; text-transform: uppercase; letter-spacing: 1px; border-bottom: 1px solid rgba(59,130,246,0.2); }
        td { padding: 15px 12px; color: #cbd5e1; border-bottom: 1px solid rgba(59,130,246,0.1); }
        tr:hover td { background: rgba(59,130,246,0.05); }
        .badge { padding: 5px 12px; border-radius: 50px; font-size: 11px; font-weight: 600; display: inline-block; }
        .badge-warning { background: linear-gradient(135deg, #f59e0b, #d97706); color: white; }
        .badge-info { background: linear-gradient(135deg, #3b82f6, #2563eb); color: white; }
        .badge-success { background: linear-gradient(135deg, #10b981, #059669); color: white; }
        .badge-danger { background: linear-gradient(135deg, #ef4444, #dc2626); color: white; }
        .btn { padding: 10px 22px; border-radius: 12px; border: none; cursor: pointer; font-size: 13px; font-weight: 600; transition: all 0.3s; }
        .btn-primary { background: linear-gradient(135deg, #3b82f6, #06b6d4); color: white; box-shadow: 0 0 15px rgba(59,130,246,0.3); }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(59,130,246,0.5); }
        .btn-danger { background: linear-gradient(135deg, #ef4444, #dc2626); color: white; }
        .btn-success { background: linear-gradient(135deg, #10b981, #059669); color: white; }
        .btn-warning { background: linear-gradient(135deg, #f59e0b, #d97706); color: white; }
        .btn-outline { background: rgba(255,255,255,0.1); color: white; border: 1px solid rgba(255,255,255,0.2); }
        .btn-sm { padding: 5px 12px; font-size: 11px; }
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(8px);
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        .modal.active { display: flex; animation: fadeIn 0.3s ease; }
        .modal-content {
            background: rgba(15, 23, 42, 0.98);
            backdrop-filter: blur(20px);
            border-radius: 24px;
            width: 90%;
            max-width: 500px;
            border: 1px solid rgba(59,130,246,0.3);
        }
        .modal-header { padding: 20px 25px; border-bottom: 1px solid rgba(59,130,246,0.2); display: flex; justify-content: space-between; align-items: center; color: white; }
        .modal-body { padding: 25px; }
        .modal-footer { padding: 20px 25px; border-top: 1px solid rgba(59,130,246,0.2); display: flex; justify-content: flex-end; gap: 12px; }
        .form-group { margin-bottom: 20px; }
        .form-label { display: block; margin-bottom: 8px; color: #60a5fa; font-size: 13px; font-weight: 500; }
        .form-control {
            width: 100%;
            padding: 12px 16px;
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(59,130,246,0.3);
            border-radius: 12px;
            color: white;
            font-size: 14px;
        }
        .form-control:focus { outline: none; border-color: #3b82f6; box-shadow: 0 0 0 3px rgba(59,130,246,0.3); }
        select.form-control { cursor: pointer; }
        .loading { text-align: center; padding: 50px; color: #94a3b8; }
        .spinner { width: 40px; height: 40px; border: 3px solid #e2e8f0; border-top-color: #3b82f6; border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 15px; }
        @keyframes spin { to { transform: rotate(360deg); } }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .toast-container {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 9999;
        }
        .toast {
            background: #1e293b;
            color: white;
            padding: 12px 20px;
            border-radius: 12px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
            animation: slideIn 0.3s ease;
            border-left: 4px solid;
        }
        .toast.success { border-left-color: #10b981; }
        .toast.error { border-left-color: #ef4444; }
        .toast.warning { border-left-color: #f59e0b; }
        .toast.info { border-left-color: #3b82f6; }
        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        @media (max-width: 1024px) { .stats-grid { grid-template-columns: repeat(2, 1fr); } }
        @media (max-width: 768px) { .sidebar { transform: translateX(-100%); } .main-content { margin-left: 0; } .stats-grid { grid-template-columns: 1fr; } .time { font-size: 1rem; } }
        .text-center { text-align: center; }
        .action-buttons { display: flex; gap: 8px; flex-wrap: wrap; }
        .search-filter { display: flex; gap: 1rem; margin-bottom: 1.5rem; flex-wrap: wrap; align-items: center; }
        .search-filter input, .search-filter select { background: rgba(255,255,255,0.1); border: 1px solid rgba(59,130,246,0.3); border-radius: 12px; padding: 10px 16px; color: white; }
        .search-filter input { flex: 1; min-width: 200px; }
        .search-filter select { width: 150px; }
    </style>
</head>
<body>
    <div class="bg-gradient"></div>
    <div class="particles" id="particles"></div>
    <div class="toast-container" id="toastContainer"></div>

    <div class="sidebar">
        <div class="logo"><div class="logo-icon"><i class="fas fa-crown"></i></div><h2>Laundry int</h2><p>Admin Panel • Premium</p></div>
        <div class="menu-item active" data-page="dashboard"><i class="fas fa-home"></i> Dashboard</div>
        <div class="menu-item" data-page="pesanan"><i class="fas fa-receipt"></i> Pesanan</div>
        <div class="menu-item" data-page="pelanggan"><i class="fas fa-users"></i> Pelanggan</div>
        <div class="menu-item" data-page="layanan"><i class="fas fa-tags"></i> Layanan</div>
        <div class="menu-item" data-page="laporan"><i class="fas fa-chart-pie"></i> Laporan</div>
        <div class="menu-item" data-page="users"><i class="fas fa-user-cog"></i> Manajemen User</div>
        <div class="menu-item logout-btn" id="logoutBtn"><i class="fas fa-sign-out-alt"></i> Logout</div>
    </div>

    <div class="main-content">
        <div class="top-bar">
            <div class="datetime"><div class="time" id="currentTime">--:--:--</div><div class="date" id="currentDate">--, -- -- ----</div></div>
            <div class="page-title"><i class="fas fa-chart-line"></i> <span id="pageTitle">Dashboard</span></div>
            <div class="user-info"><span class="user-name" id="userName">Admin</span><div class="user-avatar" id="userAvatar">A</div></div>
        </div>
        <div id="pageContent"><div class="loading"><div class="spinner"></div>Memuat data...</div></div>
    </div>

    <script>
        // Helper Functions
        function formatRupiah(angka) {
            if (angka === undefined || angka === null) return 'Rp 0';
            return 'Rp ' + angka.toLocaleString('id-ID');
        }

        function formatDate(dateString) {
            if (!dateString) return '-';
            const date = new Date(dateString);
            return date.toLocaleDateString('id-ID');
        }

        function formatTime(dateString) {
            if (!dateString) return '-';
            const date = new Date(dateString);
            return date.toLocaleString('id-ID');
        }

        function getStatusBadge(status) {
            const map = {
                'menunggu': '<span class="badge badge-warning">⏳ Menunggu</span>',
                'proses': '<span class="badge badge-info">🔄 Diproses</span>',
                'selesai': '<span class="badge badge-success">✅ Selesai</span>',
                'diambil': '<span class="badge badge-success">📦 Diambil</span>'
            };
            return map[status] || `<span class="badge">${status}</span>`;
        }

        function getPaymentBadge(status) {
            return status === 'lunas' 
                ? '<span class="badge badge-success">✅ Lunas</span>'
                : '<span class="badge badge-danger">⏳ Belum Lunas</span>';
        }

        function getRoleBadge(role) {
            const map = {
                'admin': '<span class="badge badge-danger">👑 Admin</span>',
                'operator': '<span class="badge badge-info">🔧 Operator</span>',
                'customer': '<span class="badge badge-success">👤 Customer</span>'
            };
            return map[role] || `<span class="badge">${role}</span>`;
        }

        function showToast(type, message) {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            const icons = { success: '✅', error: '❌', warning: '⚠️', info: 'ℹ️' };
            toast.innerHTML = `${icons[type] || 'ℹ️'} ${message}`;
            container.appendChild(toast);
            setTimeout(() => { toast.remove(); }, 3000);
        }

        function closeModal(modalId) {
            const modal = document.getElementById(modalId);
            if (modal) modal.remove();
        }

        function openModal(contentHtml, title = 'Form') {
            const existingModal = document.getElementById('dynamicModal');
            if (existingModal) existingModal.remove();
            
            const modalHtml = `
                <div class="modal active" id="dynamicModal">
                    <div class="modal-content">
                        <div class="modal-header">
                            <h3><i class="fas fa-${title === 'Form' ? 'edit' : 'plus'}"></i> ${title}</h3>
                            <button class="modal-close" onclick="closeModal('dynamicModal')" style="background:none; border:none; color:#94a3b8; font-size:24px; cursor:pointer;">&times;</button>
                        </div>
                        <div class="modal-body">
                            ${contentHtml}
                        </div>
                    </div>
                </div>
            `;
            document.body.insertAdjacentHTML('beforeend', modalHtml);
        }

        // Global variables
        let currentUser = null;
        let currentPageData = {};

        // Update datetime
        function updateDateTime() {
            const now = new Date();
            document.getElementById('currentTime').innerText = now.toLocaleTimeString('id-ID', { hour12: false });
            document.getElementById('currentDate').innerText = now.toLocaleDateString('id-ID', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
        }
        setInterval(updateDateTime, 1000);
        updateDateTime();

        // Particles
        function createParticles() {
            const container = document.getElementById('particles');
            for (let i = 0; i < 120; i++) {
                const p = document.createElement('div');
                p.className = 'particle';
                p.style.left = Math.random() * 100 + '%';
                p.style.animationDelay = Math.random() * 15 + 's';
                p.style.animationDuration = Math.random() * 10 + 10 + 's';
                container.appendChild(p);
            }
        }
        createParticles();

        // API calls with auth token
        async function apiRequest(endpoint, options = {}) {
            const token = localStorage.getItem('token');
            const response = await fetch(`http://localhost:3000/api${endpoint}`, {
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': token || ''
                },
                ...options
            });
            if (!response.ok) {
                const error = await response.json();
                throw new Error(error.error || error.message || 'Terjadi kesalahan');
            }
            return response.json();
        }

        // Initialize
        document.addEventListener('DOMContentLoaded', async () => {
            const savedUser = localStorage.getItem('currentUser');
            if (savedUser) currentUser = JSON.parse(savedUser);
            
            if (!currentUser || currentUser.role !== 'admin') {
                window.location.href = '/login.html';
                return;
            }
            
            document.getElementById('userName').innerText = currentUser.nama;
            document.getElementById('userAvatar').innerText = currentUser.nama.charAt(0).toUpperCase();
            
            await loadDashboard();
            
            document.querySelectorAll('.menu-item[data-page]').forEach(item => {
                item.addEventListener('click', () => loadPage(item.getAttribute('data-page')));
            });
            
            document.getElementById('logoutBtn').addEventListener('click', () => {
                localStorage.removeItem('currentUser');
                localStorage.removeItem('token');
                window.location.href = '/login.html';
            });
        });

        // Page navigation
        async function loadPage(page) {
            document.querySelectorAll('.menu-item').forEach(item => item.classList.remove('active'));
            document.querySelector(`[data-page="${page}"]`).classList.add('active');
            
            const titles = {
                dashboard: 'Dashboard', pesanan: 'Manajemen Pesanan', 
                pelanggan: 'Data Pelanggan', layanan: 'Kelola Layanan',
                laporan: 'Laporan & Statistik', users: 'Manajemen User'
            };
            document.getElementById('pageTitle').innerHTML = `<i class="fas ${page === 'dashboard' ? 'fa-chart-line' : page === 'pesanan' ? 'fa-receipt' : page === 'pelanggan' ? 'fa-users' : page === 'layanan' ? 'fa-tags' : 'fa-chart-pie'}"></i> ${titles[page]}`;
            
            document.getElementById('pageContent').innerHTML = '<div class="loading"><div class="spinner"></div>Memuat data...</div>';
            
            if (page === 'dashboard') await loadDashboard();
            else if (page === 'pesanan') await loadPesanan();
            else if (page === 'pelanggan') await loadPelanggan();
            else if (page === 'layanan') await loadLayanan();
            else if (page === 'laporan') await loadLaporan();
            else if (page === 'users') await loadUsers();
        }

        // Dashboard
        async function loadDashboard() {
            try {
                const stats = await apiRequest('/statistik');
                const aktivitas = await apiRequest('/aktivitas');
                const pesananTerbaru = await apiRequest('/pesanan?limit=5');
                
                const html = `
                    <div class="stats-grid">
                        <div class="stat-card"><div class="stat-icon"><i class="fas fa-receipt"></i></div><div class="stat-value">${stats.totalPesanan || 0}</div><div class="stat-label">Total Pesanan</div></div>
                        <div class="stat-card"><div class="stat-icon"><i class="fas fa-money-bill-wave"></i></div><div class="stat-value">${formatRupiah(stats.totalPendapatan || 0)}</div><div class="stat-label">Total Pendapatan</div></div>
                        <div class="stat-card"><div class="stat-icon"><i class="fas fa-spinner"></i></div><div class="stat-value">${stats.pesananProses || 0}</div><div class="stat-label">Dalam Proses</div></div>
                        <div class="stat-card"><div class="stat-icon"><i class="fas fa-users"></i></div><div class="stat-value">${stats.totalPelanggan || 0}</div><div class="stat-label">Total Pelanggan</div></div>
                    </div>
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; margin-bottom: 1.5rem;">
                        <div class="glass-card"><div class="card-header"><span><i class="fas fa-chart-line"></i> Pendapatan 7 Hari</span></div><div class="card-body"><canvas id="revenueChart" style="max-height: 250px;"></canvas></div></div>
                        <div class="glass-card"><div class="card-header"><span><i class="fas fa-chart-pie"></i> Status Pesanan</span></div><div class="card-body"><canvas id="statusChart" style="max-height: 250px;"></canvas></div></div>
                    </div>
                    <div class="glass-card"><div class="card-header"><span><i class="fas fa-clock"></i> Pesanan Terbaru</span><button class="btn btn-sm btn-outline" onclick="loadPage('pesanan')">Lihat Semua</button></div>
                    <div class="card-body" style="padding:0;"><table class="table"><thead><tr><th>Kode</th><th>Pelanggan</th><th>Total</th><th>Status</th><th>Tanggal</th></tr></thead><tbody>
                        ${pesananTerbaru.map(p => `<tr><td><strong>${p.kode}</strong></td><td>${p.pelangganNama}</td><td>${formatRupiah(p.totalBayar)}</td><td>${getStatusBadge(p.status)}</td><td>${p.tanggalMasuk}</td></tr>`).join('')}
                        ${pesananTerbaru.length === 0 ? '<tr><td colspan="5" class="text-center">Belum ada pesanan</td></tr>' : ''}
                    </tbody></table></div></div>
                    <div class="glass-card"><div class="card-header"><span><i class="fas fa-history"></i> Aktivitas Terkini</span></div><div class="card-body">
                        ${aktivitas.slice(0, 10).map(a => `<p style="margin-bottom:12px; color:#cbd5e1;">📌 ${a.deskripsi} <span style="color:#64748b; font-size:11px;">- ${formatTime(a.createdAt)}</span></p>`).join('')}
                        ${aktivitas.length === 0 ? '<p style="color:#64748b;">Belum ada aktivitas</p>' : ''}
                    </div></div>
                `;
                document.getElementById('pageContent').innerHTML = html;
                
                if (typeof Chart !== 'undefined') {
                    new Chart(document.getElementById('revenueChart'), {
                        type: 'line',

        }

        window.showTambahUser = function() {
            const html = `<form><div class="form-group"><label class="form-label">Nama</label><input id="nama" class="form-control" required></div><div class="form-group"><label class="form-label">Email</label><input id="email" type="email" class="form-control" required></div><div class="form-group"><label class="form-label">Password</label><input id="password" type="password" class="form-control" required></div><div class="form-group"><label class="form-label">Role</label><select id="role" class="form-control"><option value="customer">Customer</option><option value="operator">Operator</option><option value="admin">Admin</option></select></div><div class="form-group"><label class="form-label">No HP</label><input id="no_hp" class="form-control"></div><div class="modal-footer"><button class="btn btn-outline" onclick="closeModal('dynamicModal')">Batal</button><button class="btn btn-primary" onclick="simpanUser()">Simpan</button></div></form>`;
            openModal(html, 'Tambah User');
            window.simpanUser = async function() {
                const data = { nama: document.getElementById('nama').value, email: document.getElementById('email').value, password: document.getElementById('password').value, role: document.getElementById('role').value, no_hp: document.getElementById('no_hp').value };
                try {
                    const response = await fetch('http://localhost:3000/api/register', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data) });
                    const result = await response.json();
                    if (result.success) { closeModal('dynamicModal'); showToast('success', 'User ditambahkan'); loadPage('users'); }
                    else showToast('error', result.message);
                } catch(e) { showToast('error', e.message); }
            };
        };

        window.hapusUser = async function(id) {
            if (confirm('Yakin hapus user ini?')) {
                try {
                    await apiRequest(`/users/${id}`, { method: 'DELETE' });
                    showToast('success', 'User dihapus');
                    loadPage('users');
                } catch(e) { showToast('error', e.message); }
            }
        };

        window.loadPage = loadPage;
        window.closeModal = closeModal;
    </script>
</body>
</html>

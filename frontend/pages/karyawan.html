<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Karyawan Dashboard - LaundryPro</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <div class="bg-gradient"></div>
    <div class="particles" id="particles"></div>

    <div class="sidebar">
        <div class="logo">
            <div class="logo-icon"><i class="fas fa-tools"></i></div>
            <h2>LaundryPro</h2>
            <p>Karyawan Panel</p>
        </div>
        <div class="menu-item active" data-page="dashboard"><i class="fas fa-home"></i> Dashboard</div>
        <div class="menu-item" data-page="pesanan"><i class="fas fa-receipt"></i> Kelola Pesanan</div>
        <div class="menu-item" data-page="pelanggan"><i class="fas fa-users"></i> Pelanggan</div>
        <div class="menu-item logout-btn" id="logoutBtn"><i class="fas fa-sign-out-alt"></i> Logout</div>
    </div>

    <div class="main-content">
        <div class="top-bar">
            <div class="datetime">
                <div class="time" id="currentTime">--:--:--</div>
                <div class="date" id="currentDate">--, -- -- ----</div>
            </div>
            <div class="page-title"><i class="fas fa-chart-line"></i> <span id="pageTitle">Dashboard Karyawan</span></div>
            <div class="user-info">
                <span class="user-name" id="userName">Karyawan</span>
                <div class="user-avatar" id="userAvatar">K</div>
            </div>
        </div>
        <div id="pageContent"><div class="loading"><div class="spinner"></div>Memuat data...</div></div>
    </div>

    <script src="../js/utils.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/karyawan.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Pelanggan Dashboard - Laundry int</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <link rel="stylesheet" href="../css/dashboard.css">
    <!-- Third-party scripts that must be in <head> -->
    <script src="https://cdn.jsdelivr.net/npm/html2pdf.js@0.10.1/dist/html2pdf.bundle.min.js"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://app.sandbox.midtrans.com/snap/snap.js"
            data-client-key="Mid-client-5DMLHarzBBEJ_ocX"></script>
</head>
<body>
    <div class="bg-gradient"></div>

    <!-- ====== MOBILE: Hamburger + Overlay ====== -->
    <button class="mobile-menu-btn" id="mobileMenuBtn" aria-label="Menu">
        <i class="fas fa-bars"></i>
    </button>
    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <div class="particles" id="particles"></div>
    <div class="toast-container" id="toastContainer"></div>

    <!-- ====== SIDEBAR ====== -->
    <div class="sidebar" id="sidebar">
        <div class="logo">
            <div class="logo-icon"><i class="fas fa-tshirt"></i></div>
            <h2>Laundry int</h2>
            <p>Pelanggan Panel</p>
        </div>
        <div class="menu-item active" data-page="dashboard"><i class="fas fa-home"></i> Dashboard</div>
        <div class="menu-item" data-page="order"><i class="fas fa-cart-plus"></i> Pesan Laundry</div>
        <div class="menu-item" data-page="pesanan"><i class="fas fa-receipt"></i> Pesanan Saya</div>
        <div class="menu-item" data-page="tracking"><i class="fas fa-map-marker-alt"></i> Tracking</div>
        <div class="menu-item" data-page="profile"><i class="fas fa-user"></i> Profil Saya</div>
        <div class="menu-item" data-page="map"><i class="fas fa-location-dot"></i> Cek Lokasi</div>
        <div class="menu-item" data-page="settings"><i class="fas fa-cog"></i> Pengaturan</div>
        <div class="menu-item logout-btn" id="logoutBtn"><i class="fas fa-sign-out-alt"></i> Logout</div>
    </div>

    <!-- ====== MOBILE HEADER ====== -->
    <div class="mobile-header" id="mobileHeader">
        <div class="mobile-header-title">
            <i class="fas fa-home" id="mobileHeaderIcon"></i>
            <span id="mobileTitleText">Dashboard Saya</span>
        </div>
        <div class="mobile-user-info">
            <span class="user-name" id="mobileUserName">Pelanggan</span>
            <div class="user-avatar" id="mobileUserAvatar">P</div>
        </div>
    </div>

    <!-- ====== MAIN CONTENT ====== -->
    <div class="main-content">
        <div class="top-bar">
            <div class="datetime">
                <div class="time" id="currentTime">--:--:--</div>
                <div class="date" id="currentDate">--, -- -- ----</div>
            </div>
            <div class="page-title">
                <i class="fas fa-chart-line"></i>
                <span id="pageTitle">Dashboard Saya</span>
            </div>
            <div class="user-info">
                <span class="user-name" id="userName">Pelanggan</span>
                <div class="user-avatar" id="userAvatar">P</div>
            </div>
        </div>
        <div id="pageContent">
            <div class="loading"><div class="spinner"></div>Memuat data...</div>
        </div>
    </div>

    <!-- ====== BOTTOM NAVIGATION (Mobile Only) ====== -->
    <nav class="bottom-nav" aria-label="Navigasi bawah">
        <div class="bottom-nav-inner">
            <button class="bottom-nav-item active" data-page="dashboard" aria-label="Dashboard">
                <i class="fas fa-home"></i>
                <span>Home</span>
            </button>
            <button class="bottom-nav-item" data-page="order" aria-label="Pesan">
                <i class="fas fa-cart-plus"></i>
                <span>Pesan</span>
            </button>
            <button class="bottom-nav-item" data-page="pesanan" aria-label="Pesanan Saya">
                <i class="fas fa-receipt"></i>
                <span>Pesanan</span>
            </button>
            <button class="bottom-nav-item" data-page="tracking" aria-label="Tracking">
                <i class="fas fa-map-marker-alt"></i>
                <span>Tracking</span>
            </button>
            <button class="bottom-nav-item" data-page="profile" aria-label="Profil">
                <i class="fas fa-user"></i>
                <span>Profil</span>
            </button>
        </div>
    </nav>

    <!-- ===== SCRIPTS — setiap file dimuat HANYA 1x, urutan wajib dipertahankan ===== -->
    <!-- Scripts -->
    <script src="../js/api.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/utils.js"></script>
    <script src="../js/missing_functions.js"></script>
    <script src="../js/pelanggan.js"></script>
    <script src="../js/responsive-sidebar.js"></script>
</body>
</html>

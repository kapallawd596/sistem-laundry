<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Daftar - LaundryInt</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="./css/design-system.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', sans-serif;
            background: #0a0e1a;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow-x: hidden;
        }

        .bg-gradient {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -2;
            background: radial-gradient(circle at 20% 30%, #0f172a, #020617, #000000);
        }
        .bg-gradient::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: repeating-linear-gradient(45deg, rgba(59,130,246,0.03) 0px, rgba(59,130,246,0.03) 2px, transparent 2px, transparent 8px);
            pointer-events: none;
        }

        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            overflow: hidden;
        }
        .particle {
            position: absolute;
            width: 2px;
            height: 2px;
            background: #3b82f6;
            border-radius: 50%;
            opacity: 0.5;
            animation: floatParticle 15s infinite linear;
        }
        @keyframes floatParticle {
            0% { transform: translateY(100vh) scale(0); opacity: 0; }
            10% { opacity: 0.8; }
            90% { opacity: 0.5; }
            100% { transform: translateY(-100vh) scale(1); opacity: 0; }
        }

        .register-container {
            width: 100%;
            max-width: 500px;
            padding: 20px;
        }
        .register-card {
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(20px);
            border-radius: 32px;
            padding: 40px;
            border: 1px solid rgba(59, 130, 246, 0.3);
            box-shadow: 0 25px 50px rgba(0,0,0,0.3);
        }
        .logo-icon {
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, #3b82f6, #06b6d4);
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            font-size: 28px;
            box-shadow: 0 0 25px rgba(59,130,246,0.5);
        }
        .register-card h1 {
            text-align: center;
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 8px;
            background: linear-gradient(135deg, #fff, #60a5fa);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        .register-card p {
            text-align: center;
            color: #94a3b8;
            font-size: 14px;
            margin-bottom: 30px;
        }
        .form-group { margin-bottom: 20px; }
        .form-label { display: block; margin-bottom: 8px; color: #60a5fa; font-size: 13px; font-weight: 500; }
        .form-control {
            width: 100%;
            padding: 14px 16px;
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(59,130,246,0.3);
            border-radius: 16px;
            color: white;
            font-size: 14px;
            transition: all 0.3s;
        }
        .form-control:focus {
            outline: none;
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59,130,246,0.2);
        }
        .btn-register {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #3b82f6, #06b6d4);
            border: none;
            border-radius: 16px;
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 0 20px rgba(59,130,246,0.3);
        }
        .btn-register:hover { transform: translateY(-2px); box-shadow: 0 10px 30px rgba(59,130,246,0.5); }
        .login-link { text-align: center; margin-top: 25px; color: #94a3b8; font-size: 14px; }
        .login-link a { color: #60a5fa; text-decoration: none; }
        .login-link a:hover { text-decoration: underline; }
        .alert {
            padding: 12px;
            border-radius: 12px;
            margin-bottom: 20px;
            font-size: 13px;
            text-align: center;
            display: none;
        }
        .alert-success { background: rgba(16,185,129,0.2); border: 1px solid #10b981; color: #a7f3d0; }
        .alert-danger { background: rgba(239,68,68,0.2); border: 1px solid #ef4444; color: #fecaca; }
    
        /* === RESPONSIVE REGISTER === */
        @media (max-width: 480px) {
            .register-container { padding: 12px; }
            .register-card { padding: 22px 16px !important; border-radius: 22px !important; }
            .register-card h1 { font-size: 20px !important; }
            .form-control { padding: 12px 14px !important; font-size: 15px; }
            .btn-register, .btn-login { padding: 13px !important; min-height: 48px; font-size: 14px; }
            .form-row { grid-template-columns: 1fr !important; gap: 10px !important; }
        }
</style>
    <link rel="stylesheet" href="../css/responsive.css">
</head>
<body>
    <div class="bg-gradient"></div>
    <div class="particles" id="particles"></div>

    <div class="register-container">
        <div class="register-card">
            <div class="logo-icon"><i class="fas fa-user-plus"></i></div>
            <h1>Daftar Akun</h1>
            <p>Bergabung dengan Laundry int</p>

            <div id="alertMsg" class="alert"></div>

            <form id="registerForm">
                <div class="form-group">
                    <label class="form-label">Nama Lengkap</label>
                    <input type="text" id="nama" class="form-control" placeholder="Masukkan nama lengkap" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Email</label>
                    <input type="email" id="email" class="form-control" placeholder="email@example.com" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Nomor HP</label>
                    <input type="tel" id="no_hp" class="form-control" placeholder="08xxxxxxxxxx" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Password</label>
                    <input type="password" id="password" class="form-control" placeholder="Minimal 6 karakter" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Konfirmasi Password</label>
                    <input type="password" id="confirm_password" class="form-control" placeholder="Ulangi password" required>
                </div>
                <button type="submit" class="btn-register"><i class="fas fa-user-plus"></i> Daftar</button>
            </form>

            <div class="login-link">
                Sudah punya akun? <a href="login.html">Login di sini</a>
            </div>
        </div>
    </div>

    <script src="./js/api.js"></script>
    <script>
        function createParticles() {
            const container = document.getElementById('particles');
            for (let i = 0; i < 80; i++) {
                const p = document.createElement('div');
                p.className = 'particle';
                p.style.left = Math.random() * 100 + '%';
                p.style.animationDelay = Math.random() * 15 + 's';
                p.style.animationDuration = Math.random() * 10 + 10 + 's';
                container.appendChild(p);
            }
        }
        createParticles();

        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const nama = document.getElementById('nama').value.trim();
            const email = document.getElementById('email').value.trim();
            const no_hp = document.getElementById('no_hp').value.trim();
            const password = document.getElementById('password').value;
            const confirm = document.getElementById('confirm_password').value;
            const alertMsg = document.getElementById('alertMsg');

            alertMsg.style.display = 'none';

            if (password !== confirm) {
                alertMsg.className = 'alert alert-danger';
                alertMsg.textContent = 'Konfirmasi password tidak cocok!';
                alertMsg.style.display = 'block';
                return;
            }

            if (password.length < 6) {
                alertMsg.className = 'alert alert-danger';
                alertMsg.textContent = 'Password minimal 6 karakter!';
                alertMsg.style.display = 'block';
                return;
            }

            try {
                const data = await LaundryAPI.register({ 
                    nama, 
                    email, 
                    password, 
                    no_hp, 
                    alamat: '' 
                });

                if (data.success) {
                    alertMsg.className = 'alert alert-success';
                    alertMsg.textContent = 'Pendaftaran berhasil! Mengalihkan ke halaman login...';
                    alertMsg.style.display = 'block';
                    setTimeout(() => {
                        window.location.href = 'login.html';
                    }, 2000);
                } else {
                    alertMsg.className = 'alert alert-danger';
                    alertMsg.textContent = data.message || 'Pendaftaran gagal!';
                    alertMsg.style.display = 'block';
                }
            } catch (error) {
                alertMsg.className = 'alert alert-danger';
                alertMsg.textContent = 'Error: ' + error.message;
                alertMsg.style.display = 'block';
            }
        });
    </script>
    <script src="./js/ui-improvements.js"></script>
</body>
</html>
